<script>
  function toggleSubtask(element) {
    const checkIcon = element.querySelector('svg');
    const box = element.querySelector('div');
    const text = element.querySelector('span');

    const isDone = !checkIcon.classList.contains('hidden');

    if (isDone) {
      checkIcon.classList.add('hidden');
      box.classList.remove('bg-primary');
      box.classList.add('bg-comic-surface');
      text.classList.remove('line-through', 'text-text-muted');
      text.classList.add('text-border-ink', 'font-medium');
    } else {
      checkIcon.classList.remove('hidden');
      box.classList.remove('bg-comic-surface');
      box.classList.add('bg-primary');
      text.classList.add('line-through', 'text-text-muted');
      text.classList.remove('text-border-ink', 'font-medium');
    }
    updateCounter();
  }

  function updateCounter() {
    const list = document.getElementById('subtaskList');
    const total = list.children.length;
    const completed = list.querySelectorAll('.line-through').length;
    const counter = document.getElementById('subtaskCounter');
    counter.innerText = `${completed}/${total} Selesai`;
  }

  function addSubtaskPrompt() {
    const title = prompt('Masukkan nama subtask baru:');
    if (!title || title.trim() === '') return;

    const list = document.getElementById('subtaskList');
    const newRow = document.createElement('div');
    newRow.className = 'flex items-center justify-between p-3 rounded-lg bg-comic-surface transition-all';
    newRow.style.border = '2px solid #171717';
    newRow.style.boxShadow = '2px 2px 0px #171717';

    newRow.innerHTML = `
      <div class="flex items-center gap-space-sm flex-1 min-w-0 cursor-pointer" onclick="toggleSubtask(this)">
        <div class="w-6 h-6 rounded-md bg-comic-surface flex items-center justify-center shrink-0" style="border: 2px solid #171717;">
          <svg class="w-4 h-4 text-comic-surface stroke-current fill-none hidden" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span class="font-body-md text-body-md text-border-ink font-medium truncate select-none">
          ${title.trim()}
        </span>
      </div>
      <div class="flex items-center gap-1 ml-2">
        <button type="button" aria-label="Geser posisi" class="p-1 text-text-muted cursor-grab hover:text-border-ink">
          <svg class="w-4 h-4 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="6" r="1"/>
            <circle cx="15" cy="6" r="1"/>
            <circle cx="9" cy="12" r="1"/>
            <circle cx="15" cy="12" r="1"/>
            <circle cx="9" cy="18" r="1"/>
            <circle cx="15" cy="18" r="1"/>
          </svg>
        </button>
        <button type="button" aria-label="Hapus subtask" onclick="this.parentElement.parentElement.remove(); updateCounter();" class="p-1 text-text-muted hover:text-accent-red active:scale-90 transition-transform">
          <svg class="w-4 h-4 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    `;

    list.appendChild(newRow);
    updateCounter();
  }

  function selectPriority(btn, level) {
    const tabs = document.querySelectorAll('.priority-tab');
    tabs.forEach(t => {
      t.className = 'priority-tab py-2.5 rounded-lg font-label-md text-label-md text-center transition-all text-text-muted hover:text-border-ink';
      t.style.border = 'none';
      t.style.boxShadow = 'none';
    });

    btn.style.border = '2px solid #171717';
    btn.style.boxShadow = '2px 2px 0 #171717';

    if (level === 'low') {
      btn.className = 'priority-tab py-2.5 rounded-lg font-label-md text-label-md text-center transition-all bg-secondary-fixed text-border-ink font-bold';
    } else if (level === 'medium') {
      btn.className = 'priority-tab py-2.5 rounded-lg font-label-md text-label-md text-center transition-all bg-secondary-container text-border-ink font-bold';
    } else {
      btn.className = 'priority-tab py-2.5 rounded-lg font-label-md text-label-md text-center transition-all bg-accent-red text-comic-surface font-bold';
    }
  }

  function selectRecurrence(btn) {
    const buttons = document.querySelectorAll('.recurrence-btn');
    buttons.forEach(b => {
      b.classList.remove('bg-primary-fixed', 'text-border-ink');
      b.classList.add('bg-comic-surface', 'text-text-muted');
    });
    btn.classList.remove('bg-comic-surface', 'text-text-muted');
    btn.classList.add('bg-primary-fixed', 'text-border-ink');
  }

  // Handle Telegram Toggle Visibility
  document.getElementById('telegramToggle')?.addEventListener('change', function(e) {
    const options = document.getElementById('reminderOptions');
    if (e.target.checked) {
      options.style.opacity = '1';
      options.style.pointerEvents = 'auto';
    } else {
      options.style.opacity = '0.4';
      options.style.pointerEvents = 'none';
    }
  });
</script></main>
