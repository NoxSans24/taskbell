name: Flutter CI

on:
  push:
    paths:
      - 'taskbell_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'taskbell_app/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  analyze-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: taskbell_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pasang dependensi
        run: flutter pub get

      - name: Analisis statis
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-test

    defaults:
      run:
        working-directory: taskbell_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pasang dependensi
        run: flutter pub get

      # Tanpa keystore.properties, Gradle memakai debug signing agar build CI
      # tetap berjalan. Artefak ini tidak untuk distribusi.
      - name: Build APK release (unsigned/CI)
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=https://api.example.invalid

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: taskbell-release-apk
          path: taskbell_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
