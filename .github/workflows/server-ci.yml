name: Server CI

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskbell
          POSTGRES_PASSWORD: taskbell
          POSTGRES_DB: taskbell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskbell"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taskbell:taskbell@localhost:5432/taskbell_test?schema=public
      NODE_ENV: test

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan rahasia khusus CI
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "TELEGRAM_TOKEN_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Terapkan migrasi
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --runInBand

      - name: Audit dependensi produksi
        run: npm audit --omit=dev
